name: Android APK

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Validate and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Public base URL of the VEYRA API layer. Set the repository variable
      # VEYRA_API_BASE_URL (Settings -> Secrets and variables -> Actions ->
      # Variables). The provider credential belongs to the API deployment and
      # is never part of this build or the APK.
      VITE_VEYRA_API_BASE_URL: ${{ vars.VEYRA_API_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require the VEYRA API base URL
        run: |
          if [ -z "$VITE_VEYRA_API_BASE_URL" ]; then
            echo "::error::Set the VEYRA_API_BASE_URL repository variable to the deployed VEYRA API base URL."
            exit 1
          fi
          case "$VITE_VEYRA_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::VEYRA_API_BASE_URL must be an absolute https URL."; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build tools
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run service-layer tests
        run: npm test

      - name: Validate frontend production build
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
        working-directory: android

      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: veyra-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
