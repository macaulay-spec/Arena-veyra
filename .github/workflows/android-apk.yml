name: Android APK

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Validate and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # VITE_* values are PUBLIC: Vite compiles them into the web bundle and the
    # APK. There is no backend in this project that could hold a secret.
    env:
      VITE_MOVIEBOX_API_BASE_URL: https://api.zstlab.cyou
      VITE_ZST_API_KEY: ${{ secrets.VITE_ZST_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build tools
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check catalog configuration
        run: |
          if [ -z "${VITE_ZST_API_KEY}" ]; then
            echo "::warning::VITE_ZST_API_KEY is not set. The build will show an explicit API-configuration error instead of a catalog."
          fi

      - name: Run service-layer tests
        run: npm test

      - name: Run render smoke test
        run: npm run test:ssr

      - name: Validate frontend production build
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
        working-directory: android

      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: veyra-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
